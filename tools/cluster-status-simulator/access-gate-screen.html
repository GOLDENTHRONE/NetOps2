<title>Cluster Access Gate</title>
<meta name="description" content="Modern, centered interstitial shown when opening a cluster — one screen for every access state, with real messages.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f3f6f9; --bg-2:#e8eef3; --surface:#ffffff; --ink:#141d27; --ink-soft:#46586c;
    --ink-faint:#7c8da0; --line:#dde4ec; --line-strong:#c6d0dc;
    --brand:#0e7c86; --brand-ink:#0a5b63; --brand-soft:#d6ecee;
    --good:#1f8f4e; --good-soft:#dcf1e4;
    --warn:#b8730b; --warn-soft:#f7e9cf;
    --bad:#c23b3b; --bad-soft:#f7dede;
    --info:#2563a8; --info-soft:#dce9f7;
    --shadow-sm:0 1px 2px rgba(20,29,39,.06);
    --shadow-lg:0 4px 12px rgba(20,29,39,.08), 0 24px 60px rgba(20,29,39,.10);
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --r:18px;
  }
  :root:not([data-theme="light"]) { @media (prefers-color-scheme: dark) {
    --bg:#0d141b; --bg-2:#0a1016; --surface:#161f29; --ink:#e9eef4; --ink-soft:#aab8c8;
    --ink-faint:#6d7f92; --line:#273441; --line-strong:#3a4b5b;
    --brand:#37bcc6; --brand-ink:#7ad6dd; --brand-soft:#0f363c;
    --good:#48c77f; --good-soft:#0f3324; --warn:#e3a54c; --warn-soft:#3a2c12;
    --bad:#e77471; --bad-soft:#3c1d1d; --info:#5aa0e6; --info-soft:#122a41;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-lg:0 4px 12px rgba(0,0,0,.4), 0 24px 60px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"] {
    --bg:#0d141b; --bg-2:#0a1016; --surface:#161f29; --ink:#e9eef4; --ink-soft:#aab8c8;
    --ink-faint:#6d7f92; --line:#273441; --line-strong:#3a4b5b;
    --brand:#37bcc6; --brand-ink:#7ad6dd; --brand-soft:#0f363c;
    --good:#48c77f; --good-soft:#0f3324; --warn:#e3a54c; --warn-soft:#3a2c12;
    --bad:#e77471; --bad-soft:#3c1d1d; --info:#5aa0e6; --info-soft:#122a41;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-lg:0 4px 12px rgba(0,0,0,.4), 0 24px 60px rgba(0,0,0,.5);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--sans); color:var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--bg-2), transparent 60%),
      var(--bg);
    -webkit-font-smoothing:antialiased; }

  /* state switcher (mock only) */
  .switcher { position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:center;
    padding:10px 12px; background:color-mix(in srgb, var(--surface) 80%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .switcher b { font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-right:4px; }
  .switcher button { font:inherit; font-size:12.5px; padding:6px 12px; border-radius:999px;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); cursor:pointer; }
  .switcher button[aria-pressed="true"] { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:500; }
  :root[data-theme="dark"] .switcher button[aria-pressed="true"],
  :root:not([data-theme="light"]) .switcher button[aria-pressed="true"]{ color:#08131a; }
  .switcher button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }

  /* the gate */
  .stage { min-height:100dvh; display:grid; place-items:center; padding:96px 20px 40px; }
  .gate {
    width:100%; max-width:480px; text-align:center;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--shadow-lg); padding:40px 36px 32px;
    display:flex; flex-direction:column; align-items:center; gap:0;
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity:0; transform:translateY(12px) scale(.99); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ .gate{ animation:none; } .spin{ animation:none !important; } .pulse{ animation:none !important; } }

  .halo { width:84px; height:84px; border-radius:50%; display:grid; place-items:center; margin-bottom:22px; position:relative; }
  .halo svg { width:36px; height:36px; }
  .halo.info { background:var(--info-soft); color:var(--info); }
  .halo.good { background:var(--good-soft); color:var(--good); }
  .halo.warn { background:var(--warn-soft); color:var(--warn); }
  .halo.bad  { background:var(--bad-soft);  color:var(--bad); }
  .halo .pulse { position:absolute; inset:0; border-radius:50%; border:2px solid currentColor; opacity:.4;
    animation:pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0%{ transform:scale(1); opacity:.35;} 100%{ transform:scale(1.5); opacity:0; } }
  .spin { animation:spin 1s linear infinite; transform-origin:center; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .kicker { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); margin:0 0 8px; }
  .gate h1 { font-size:22px; line-height:1.25; margin:0 0 8px; letter-spacing:-.01em; text-wrap:balance; }
  .cluster { font-family:var(--mono); font-size:13px; color:var(--brand-ink);
    background:var(--brand-soft); padding:4px 10px; border-radius:8px; margin:0 0 16px; word-break:break-all; max-width:100%; }
  .gate p.body { font-size:15px; color:var(--ink-soft); margin:0 0 24px; max-width:40ch; }

  .actions { display:flex; flex-direction:column; gap:10px; width:100%; }
  .btn { font:inherit; font-size:15px; font-weight:500; padding:12px 18px; border-radius:11px; cursor:pointer;
    border:1px solid transparent; display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; }
  .btn svg { width:17px; height:17px; }
  .btn.primary { background:var(--brand); color:#fff; box-shadow:var(--shadow-sm); }
  :root[data-theme="dark"] .btn.primary, :root:not([data-theme="light"]) .btn.primary { color:#08131a; }
  .btn.primary:hover { filter:brightness(1.06); }
  .btn.ghost { background:transparent; color:var(--ink-soft); border-color:var(--line-strong); }
  .btn.ghost:hover { background:var(--bg-2); }
  .btn:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }

  .meta { margin-top:20px; font-size:12.5px; color:var(--ink-faint); display:flex; align-items:center; gap:7px; justify-content:center; }
  .meta .live { width:7px; height:7px; border-radius:50%; background:var(--good); box-shadow:0 0 0 0 var(--good); animation:live 2s ease-out infinite; }
  @keyframes live { 0%{ box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%, transparent);} 100%{ box-shadow:0 0 0 7px transparent; } }

  details.tech { margin-top:18px; width:100%; text-align:left; }
  details.tech summary { font-size:12.5px; color:var(--ink-faint); cursor:pointer; list-style:none; text-align:center; }
  details.tech summary::-webkit-details-marker { display:none; }
  details.tech summary:hover { color:var(--ink-soft); }
  .tech pre { margin:10px 0 0; font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);
    background:var(--bg-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; overflow-x:auto; white-space:pre-wrap; word-break:break-all; }
  .progress { width:100%; height:3px; border-radius:999px; background:var(--bg-2); overflow:hidden; margin-top:2px; }
  .progress i { display:block; height:100%; width:40%; background:var(--brand); border-radius:999px; animation:slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0%{ transform:translateX(-120%);} 100%{ transform:translateX(320%);} }
</style>

<div class="switcher" role="group" aria-label="Preview state">
  <b>State</b>
  <button data-s="checking" type="button">Checking</button>
  <button data-s="ready" type="button">Ready</button>
  <button data-s="expired" type="button">Session expired</button>
  <button data-s="forbidden" type="button">No access</button>
  <button data-s="unreachable" type="button">Unreachable</button>
  <button data-s="theme" type="button" style="margin-left:10px">◐ Theme</button>
</div>

<div class="stage">
  <main class="gate" id="gate" role="status" aria-live="polite"><!-- filled by JS --></main>
</div>

<script>
  const IC = {
    shield:'<path d="M12 3l7 3v5c0 4.4-3 8.5-7 10-4-1.5-7-5.6-7-10V6l7-3z"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.5 12.5 20 3"/><path d="M16 7l3 3"/>',
    lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
    cloudoff:'<path d="M3 3l18 18"/><path d="M8.5 8.5A5 5 0 0 0 6 18h9"/><path d="M19.9 15.2A4 4 0 0 0 17 8h-1.3a6 6 0 0 0-1.2-2.3"/>',
    back:'<path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>',
    refresh:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/>',
  };
  const svg = (paths, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;

  // Messages are DERIVED from live state (cluster name + real reason), never hardcoded.
  const CLUSTER = 'cluster-ocp-b';
  const states = {
    checking: {
      halo:'info', icon: svg(IC.shield,'') , pulse:true, kicker:'Opening cluster',
      title:'Checking your access…',
      body:`Confirming that <b>${CLUSTER}</b> is reachable and your sign-in is still valid. This takes a moment.`,
      progress:true,
      meta:'Live check in progress',
      actions:[{cls:'ghost', icon:IC.back, label:'Back to All Clusters'}],
      tech:null,
    },
    ready: {
      halo:'good', icon: svg(IC.check), kicker:'Access confirmed',
      title:'You’re in — opening now',
      body:`<b>${CLUSTER}</b> is reachable and your access is valid. Taking you to the cluster…`,
      progress:true, meta:'Verified just now',
      actions:[{cls:'ghost', icon:IC.back, label:'Back to All Clusters'}],
      tech:null,
    },
    expired: {
      halo:'warn', icon: svg(IC.key), kicker:'Sign-in needed',
      title:'Your session for this cluster expired',
      body:`We reached <b>${CLUSTER}</b>, but your sign-in is no longer valid. Sign in again to continue — your other clusters stay connected.`,
      meta:null,
      actions:[
        {cls:'primary', icon:IC.key, label:'Sign in again'},
        {cls:'ghost', icon:IC.back, label:'Back to All Clusters'},
      ],
      tech:'HTTP 401 · selfsubjectrulesreviews\nAuthentication required — token rejected by the API server.',
    },
    forbidden: {
      halo:'bad', icon: svg(IC.lock), kicker:'Access limited',
      title:'You don’t have access to this cluster',
      body:`You’re signed in, but your account isn’t allowed to view <b>${CLUSTER}</b>. Ask a cluster admin for access, then try again.`,
      meta:null,
      actions:[
        {cls:'ghost', icon:IC.back, label:'Back to All Clusters'},
      ],
      tech:'HTTP 403 · selfsubjectrulesreviews\nInsufficient permissions for the requested namespace.',
    },
    unreachable: {
      halo:'bad', icon: svg(IC.cloudoff), kicker:'Not responding',
      title:'This cluster isn’t responding',
      body:`We couldn’t reach <b>${CLUSTER}</b> right now. It may be down, or the connection timed out. You can retry, or go back.`,
      meta:null,
      actions:[
        {cls:'primary', icon:IC.refresh, label:'Retry now'},
        {cls:'ghost', icon:IC.back, label:'Back to All Clusters'},
      ],
      tech:'HTTP 502 · /version\nUpstream unreachable through the proxy (timed out after 5s).',
    },
  };

  let cur = 'checking';
  function render(){
    const s = states[cur];
    const gate = document.getElementById('gate');
    const iconHtml = cur==='checking'
      ? svg(IC.shield, 'spin')  // subtle motion while checking
      : s.icon;
    gate.innerHTML = `
      <div class="halo ${s.halo}">${s.pulse?'<span class="pulse"></span>':''}${iconHtml}</div>
      <p class="kicker">${s.kicker}</p>
      <h1>${s.title}</h1>
      <span class="cluster">${CLUSTER}</span>
      <p class="body">${s.body}</p>
      ${s.progress?'<div class="progress"><i></i></div>':''}
      <div class="actions">
        ${s.actions.map(a=>`<button class="btn ${a.cls}" type="button">${svg(a.icon)}${a.label}</button>`).join('')}
      </div>
      ${s.meta?`<div class="meta"><span class="live"></span>${s.meta}</div>`:''}
      ${s.tech?`<details class="tech"><summary>Technical details</summary><pre>${s.tech}</pre></details>`:''}
    `;
    document.querySelectorAll('.switcher button[data-s]').forEach(b=>{
      if(b.dataset.s!=='theme') b.setAttribute('aria-pressed', String(b.dataset.s===cur));
    });
  }
  document.querySelectorAll('.switcher button[data-s]').forEach(b=>{
    b.onclick = () => {
      if(b.dataset.s==='theme'){
        const c=document.documentElement.getAttribute('data-theme');
        const n=c==='dark'?'light':c==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark');
        document.documentElement.setAttribute('data-theme', n); return;
      }
      cur=b.dataset.s; render();
    };
  });
  render();
</script>
